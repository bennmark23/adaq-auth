<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADAQ Recovery</title>
<link rel="stylesheet" href="auth.css"></head><body>
<div id="authOverlay" style="display:flex">
  <div class="card" id="recBox">
    <h2>ADAQ Recovery</h2>
    <small style="color:#8791a3">Use this link to regain access, then set up a new authenticator.</small>
    <div id="recInfo"></div>
    <button onclick="doRecover()">Login via Recovery Link</button>
    <div id="recMsg" style="color:#ea3943;margin-top:8px"></div>
  </div>
</div>
<script>
const SERVER_URL = (function(){ try { const cu = JSON.parse(localStorage.getItem('cu')||'""'); if (cu) return String(cu).replace(/\/+$/,''); } catch(e){} return localStorage.getItem('adaq_server_url') || location.origin; })().replace(/\/+$/,'');
const API = SERVER_URL + '/api';
const token = new URLSearchParams(location.search).get('token');
async function doRecover() {
  const msg = document.getElementById('recMsg');
  try {
    const r = await fetch(API + '/recover/' + token + '/login', { method: 'POST' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Failed');
    sessionStorage.setItem('adaq_token', j.token);
    localStorage.setItem('adaq_last_user', JSON.stringify({ username: j.user.username, avatar: j.user.avatar }));
    if (j.needsTotpEnroll && j.totpSecret) {
      sessionStorage.setItem('adaq_pending_secret', j.totpSecret);
      sessionStorage.setItem('adaq_pending_qr', j.qr);
    }
    window.location.href = '/?recover=1';
  } catch (e) { msg.textContent = e.message; }
}
(async () => {
  try {
    const r = await fetch(API + '/recover/' + token);
    const j = await r.json();
    if (r.ok) document.getElementById('recInfo').textContent = 'Account: ' + j.username;
    else document.getElementById('recMsg').textContent = j.error || 'Invalid link';
  } catch (e) { document.getElementById('recMsg').textContent = e.message; }
})();
</script></body></html>
