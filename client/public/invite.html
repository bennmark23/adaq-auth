<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADAQ Invite</title>
<link rel="stylesheet" href="auth.css"></head><body>
<div id="authOverlay" style="display:flex">
  <div class="card">
    <h2 style="color:#e6e9ef">Join ADAQ</h2>
    <small style="color:#e6e9ef">Click "Register" to create your account.</small>
    <input id="regUser" placeholder="Username" style="background:#fff;color:#000">
    <input id="regPass" type="password" placeholder="Password" style="background:#fff;color:#000">
    <button onclick="doRegister()">Register</button>
    <div id="regMsg" style="color:#ea3943;margin-top:8px"></div>
  </div>
  <div id="enrollModal" class="modal hidden"><div class="sheet" style="background:#0b0e14">
    <h3 style="color:#e6e9ef">Set up Authenticator</h3>
    <p style="color:#e6e9ef">Scan this QR with Google Authenticator, or copy the key.</p>
    <img id="enrollQr" style="width:200px;height:200px;background:#fff;border-radius:8px">
    <div id="enrollSecret" style="word-break:break-all;font-family:monospace;margin:8px 0;color:#e6e9ef;background:#141a24;padding:8px;border-radius:8px"></div>
    <input id="enrollCode" placeholder="6-digit code" style="background:#fff;color:#000">
    <small style="color:#9aa4b5;display:block;margin:6px 0 10px">Codes change every 30 seconds. If a correct code is rejected, set your phone's date &amp; time to automatic, then try the newest code.</small>
    <button onclick="doEnroll()">Verify & Enable</button>
    <button onclick="doBack()">Back</button>
    <div id="enrollMsg" style="color:#ea3943;margin-top:8px"></div>
  </div></div>
</div>
<script>
const API = (location.origin) + '/api';
const token = new URLSearchParams(location.search).get('token');
function doBack() {
  // Go back to register form. Keep token if already registered,
  // so doRegister can fall back to change-password instead of re-registering.
  document.getElementById('regUser').value = '';
  document.getElementById('regPass').value = '';
  document.getElementById('regMsg').textContent = '';
  document.getElementById('enrollModal').classList.add('hidden');
  document.getElementById('authOverlay').style.display = 'flex';
}
async function doRegister() {
  const u = document.getElementById('regUser').value.trim();
  const p = document.getElementById('regPass').value;
  const msg = document.getElementById('regMsg');
  msg.textContent = '';
  try {
    const r = await fetch(API + '/invite/' + token + '/register', { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({username: u, password: p}) });
    const j = await r.json();
    if (!r.ok) {
      // If already registered (invitation may be used), allow changing password via change-password
      const oldTok = sessionStorage.getItem('adaq_token');
      const oldPass = sessionStorage.getItem('adaq_registered_pass') || '';
      if (oldTok && p) {
        const r2 = await fetch(API + '/auth/change-password', { method: 'POST', headers: {'content-type':'application/json','authorization':'Bearer '+oldTok}, body: JSON.stringify({oldPassword: oldPass, newPassword: p}) });
        const j2 = await r2.json();
        if (!r2.ok) throw new Error(j2.error || 'Failed');
        sessionStorage.setItem('adaq_registered_pass', p);
        // Also allow changing username via profile endpoint
        const uNew = u;
        if (uNew) {
          try { await fetch(API + '/profile/username', { method: 'POST', headers: {'content-type':'application/json','authorization':'Bearer '+oldTok}, body: JSON.stringify({ username: uNew }) }); } catch(e) {}
        }
        await startTotpEnrollment();
        return;
      }
      throw new Error(j.error || 'Failed');
    }
    sessionStorage.setItem('adaq_token', j.token);
    sessionStorage.setItem('adaq_registered_pass', p);
    await startTotpEnrollment();
  } catch (e) { msg.textContent = e.message; }
}
async function startTotpEnrollment() {
  try {
    const r = await fetch(API + '/auth/change-password', { method: 'POST', headers: {'content-type':'application/json','authorization':'Bearer '+sessionStorage.getItem('adaq_token')}, body: JSON.stringify({oldPassword: sessionStorage.getItem('adaq_registered_pass') || '', newPassword: sessionStorage.getItem('adaq_registered_pass') || ''}) });
    const j = await r.json();
    if (r.ok && j.totpSecret) {
      document.getElementById('enrollQr').src = j.qr;
      document.getElementById('enrollSecret').textContent = j.totpSecret;
      document.getElementById('enrollModal').classList.remove('hidden');
    }
  } catch(e) {}
}
async function doEnroll() {
  const code = document.getElementById('enrollCode').value.trim();
  const msg = document.getElementById('enrollMsg');
  msg.textContent = '';
  try {
    const r = await fetch(API + '/auth/enroll-totp', { method: 'POST', headers: {'content-type':'application/json','authorization':'Bearer '+sessionStorage.getItem('adaq_token')}, body: JSON.stringify({code}) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error === 'Invalid code'
      ? "Invalid code. Use the newest code (it changes every 30s). If it keeps failing, set your phone's date & time to automatic."
      : (j.error || 'Failed'));
    document.getElementById('enrollModal').classList.add('hidden');
    location.href = '/';
  } catch (e) { msg.textContent = e.message; }
}
</script></body></html>
