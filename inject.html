<link rel="stylesheet" href="auth.css">
<div id="authOverlay" style="display:none">
  <div class="card" id="loginBox">
    <h2>ADAQ</h2>
    <small style="color:#8791a3">Welcome Champ</small>
    <input id="loginUser" placeholder="Username">
    <input id="loginPass" type="password" placeholder="Password">
    <input id="loginTotp" placeholder="Authenticator code (if enabled)">
    <button onclick="doLogin()">Login</button>
    <div id="loginMsg" style="color:#ea3943;margin-top:8px"></div>
  </div>
  <div class="card" id="registerBox" style="display:none">
    <h2>Join ADAQ</h2>
    <small id="regRole"></small>
    <input type="hidden" id="regToken">
    <input id="regUser" placeholder="Username">
    <input id="regPass" type="password" placeholder="Password">
    <button onclick="doRegister()">Register</button>
    <div id="regMsg" style="color:#ea3943;margin-top:8px"></div>
  </div>
</div>
<div id="announceBar" style="display:none;position:fixed;top:0;left:0;right:0;background:#f5a524;color:#04140d;padding:8px 12px;z-index:80;font-weight:600"></div>
<div id="cpModal" class="modal hidden"><div class="sheet">
  <h3>Change Password</h3>
  <input id="cpOld" type="password" placeholder="Old password">
  <input id="cpNew" type="password" placeholder="New password">
  <button onclick="submitChangePassword()">Change</button>
  <div id="cpMsg" style="color:#ea3943;margin-top:8px"></div>
</div></div>
<div id="enrollModal" class="modal hidden"><div class="sheet">
  <h3>Set up Authenticator</h3>
  <p>Scan this QR with Google Authenticator, or copy the key.</p>
  <img id="enrollQr" style="width:200px;height:200px">
  <div id="enrollSecret" style="word-break:break-all;font-family:monospace;margin:8px 0"></div>
  <input id="enrollCode" placeholder="6-digit code">
  <button onclick="submitEnroll()">Verify & Enable</button>
  <div id="enrollMsg" style="color:#ea3943;margin-top:8px"></div>
</div></div>
<div id="profileModal" class="modal hidden"><div class="sheet">
  <h3>Profile</h3>
  <img id="profAvatarImg" class="avatar" src="">
  <input type="file" id="profAvatarFile" accept="image/*">
  <button onclick="uploadAvatar()">Upload Photo</button>
  <div style="margin-top:8px"><small>Username (change once per week)</small><input id="profNewUser" placeholder="New username"><button onclick="changeUsername()">Change Username</button></div>
  <div style="margin-top:8px"><small>Theme</small><select id="profTheme"><option value="dark">Dark</option><option value="light">Light</option><option value="blue">Blue</option><option value="yellow">Yellow</option><option value="brown">Brown</option></select></div>
  <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="profAlerts" style="width:auto"> Alerts & notifications</label>
  <button onclick="saveProfile()">Save</button>
  <h3>Journal</h3>
  <textarea id="journalInput" style="width:100%;height:80px"></textarea>
  <button onclick="addJournal()">Add Entry</button>
  <div id="journalList"></div>
  <button onclick="document.getElementById('profileModal').classList.add('hidden')">Close</button>
</div></div>
<div id="adminModal" class="modal hidden"><div class="sheet">
  <h3>Admin</h3>
  <div class="tabbar">
    <button class="on" onclick="switchAdminTab('users')">Users</button>
    <button onclick="switchAdminTab('activity')">Activity</button>
    <button onclick="switchAdminTab('invite')">Invite</button>
    <button onclick="switchAdminTab('announce')">Announce</button>
    <button onclick="switchAdminTab('messages')">Messages</button>
  </div>
  <div id="adminTab_users"><div id="adminUsers"></div></div>
  <div id="adminTab_activity" style="display:none"><div id="adminActivity"></div></div>
  <div id="adminTab_invite" style="display:none">
    <select id="inviteRole"><option value="user">User</option><option value="subadmin">Sub-admin</option></select>
    <button onclick="createInvite()">Generate Invitation Link</button>
    <div id="inviteOut"></div>
  </div>
  <div id="adminTab_announce" style="display:none">
    <textarea id="announceInput" style="width:100%;height:80px"></textarea>
    <button onclick="sendAnnouncement()">Announce</button>
  </div>
  <div id="adminTab_messages" style="display:none">
    <input id="msgTo" placeholder="To user id (blank=broadcast)">
    <select id="msgEnc"><option value="">No auto-delete</option><option value="daily">Delete after 1 day</option><option value="weekly">Delete after 1 week</option><option value="monthly">Delete after 1 month</option></select>
    <input type="file" id="msgImg">
    <textarea id="msgInput" style="width:100%;height:60px"></textarea>
    <button onclick="sendMessage()">Send</button>
    <div id="msgList"></div>
  </div>
  <button onclick="document.getElementById('adminModal').classList.add('hidden')">Close</button>
</div></div>
<script>
function switchAdminTab(t){
  ['users','activity','invite','announce','messages'].forEach(x=>{
    document.getElementById('adminTab_'+x).style.display = x===t?'block':'none';
  });
  document.querySelectorAll('#adminModal .tabbar button').forEach((b,i)=>b.classList.toggle('on',['users','activity','invite','announce','messages'][i]===t));
  if(t==='users'||t==='activity') loadAdmin();
  if(t==='messages') loadMessages();
}
</script>
<script src="auth.js"></script>
<div style="position:fixed;bottom:70px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:70">
  <button onclick="document.getElementById('profileModal').classList.remove('hidden');loadJournal()" style="border-radius:50%;width:44px;height:44px">👤</button>
  <button id="adminBtn" onclick="document.getElementById('adminModal').classList.remove('hidden');loadAdmin()" style="border-radius:50%;width:44px;height:44px;display:none">🛡️</button>
  <button onclick="logout()" style="border-radius:50%;width:44px;height:44px">🚪</button>
</div>
